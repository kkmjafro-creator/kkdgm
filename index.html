<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KKM CORE</title>
<link rel="icon" type="image/png" href="./kkm.png">
<link rel="apple-touch-icon" href="./kkm.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#f4f5fa;--card:#ffffff;--tx:#181b2c;--mu:#62677d;--bd:#e2e5f0;
  --ac:#3a3fd8;--acs:#e9eaff;--onac:#ffffff;
  --bio:#0b8f63;--bios:#d8f3e8;
  --jee:#d4470f;--jees:#ffe6d9;
  --hd1:#1d1f5e;--hd2:#3a3fd8;--danger:#c92a2a;
  --shadow:0 1px 2px rgba(24,27,44,.06),0 6px 20px rgba(24,27,44,.06);
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1119;--card:#181b27;--tx:#eceef7;--mu:#9aa0b8;--bd:#2a2e42;
  --ac:#8c93ff;--acs:#23274f;--onac:#0f1119;
  --bio:#4fd8a4;--bios:#123227;
  --jee:#ff9c6e;--jees:#3a2217;
  --hd1:#10123a;--hd2:#2a2f9e;--danger:#ff7b7b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25);
}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 var(--body)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}

/* Header */
header{
  background:
    radial-gradient(circle at 12% 120%,rgba(255,255,255,.14) 0 22%,transparent 23%),
    radial-gradient(circle at 92% -20%,rgba(255,255,255,.12) 0 26%,transparent 27%),
    linear-gradient(135deg,var(--hd1),var(--hd2));
  color:#fff;padding:20px 20px 34px;
}
.top{max-width:820px;margin:0 auto;display:flex;justify-content:flex-end;min-height:38px;align-items:center;gap:10px}
.who{font-size:.88rem;opacity:.9}
.hbtn{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35);padding:7px 16px;border-radius:99px;font:inherit;font-size:.88rem;font-weight:500;cursor:pointer;transition:background .15s}
.hbtn:hover{background:rgba(255,255,255,.28)}
.brand{max-width:820px;margin:10px auto 0;text-align:left}
.brand h1{margin:0;font:800 clamp(2.4rem,8vw,3.6rem)/1 var(--display);letter-spacing:.02em}
.brand p{margin:10px 0 0;font-size:1.02rem;opacity:.92;max-width:34ch}

main{max-width:820px;margin:0 auto;padding:22px 16px 40px}

/* Filters */
.filters{display:grid;gap:10px;margin-bottom:18px}
.group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.group>span{font-size:.85rem;color:var(--mu);min-width:64px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 14px;border-radius:99px;cursor:pointer;font:inherit;font-size:.9rem;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--ac)}
.chip.on{background:var(--ac);color:var(--onac);border-color:var(--ac);font-weight:600}

/* Post cards: colored spine shows the section */
.card{position:relative;background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--ac);border-radius:0;padding:16px 18px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card.bio{border-left-color:var(--bio)}
.card.jee{border-left-color:var(--jee)}
.card h3{margin:8px 0 0;font:600 1.25rem/1.3 var(--display);overflow-wrap:anywhere}
.card p{margin:8px 0 0;color:var(--mu);white-space:pre-wrap;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8rem}
.tag{padding:2px 10px;border-radius:99px;background:var(--acs);color:var(--ac);font-weight:600}
.tag.bio{background:var(--bios);color:var(--bio)}
.tag.jee{background:var(--jees);color:var(--jee)}
.tag.kind{background:transparent;border:1px solid var(--bd);color:var(--mu);font-weight:500}
.tag.kind.link{border-color:var(--ac);color:var(--ac)}
.date{color:var(--mu);margin-left:auto}
a.go{display:inline-block;margin-top:12px;background:var(--acs);color:var(--ac);font-weight:600;text-decoration:none;padding:8px 16px;border-radius:99px;overflow-wrap:anywhere;transition:background .15s,color .15s}
a.go:hover{background:var(--ac);color:var(--onac)}
.del{position:absolute;top:12px;right:14px;background:none;border:0;color:var(--danger);cursor:pointer;font:inherit;font-size:.82rem;padding:2px 6px;border-radius:6px}
.del:hover{background:var(--jees)}
.card.has-del .meta{padding-right:56px}
.empty{text-align:center;color:var(--mu);padding:40px 12px;border:2px dashed var(--bd);border-radius:16px}

/* Teacher form */
.admin{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:22px;box-shadow:var(--shadow)}
.admin h2{margin:0 0 4px;font:600 1.2rem var(--display)}
.admin .hint{margin:0;color:var(--mu);font-size:.9rem}
label{display:block;font-size:.84rem;color:var(--mu);margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{margin-top:16px;background:var(--ac);color:var(--onac);border:0;padding:11px 22px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:transparent;color:var(--mu);border:1px solid var(--bd);margin-left:8px}
.msg{font-size:.88rem;margin-top:10px;color:var(--danger);min-height:1.2em}

/* Login dialog */
dialog{border:0;border-radius:18px;padding:24px;width:min(380px,92vw);background:var(--card);color:var(--tx);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,12,30,.55);backdrop-filter:blur(3px)}
dialog h2{margin:0 0 2px;font:600 1.4rem var(--display)}
dialog p{margin:0;color:var(--mu);font-size:.92rem}

footer{text-align:center;color:var(--mu);font-size:.88rem;padding:20px 12px 30px;border-top:1px solid var(--bd)}
@media (max-width:520px){.row{grid-template-columns:1fr}.group>span{min-width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ===== motion ===== */
#prog{position:fixed;top:0;left:0;height:3px;width:100%;transform:scaleX(0);transform-origin:0 50%;background:linear-gradient(90deg,var(--bio),var(--ac),var(--jee));z-index:50}
header{position:relative;overflow:hidden;isolation:isolate}
.top,.brand{position:relative;z-index:1}
.blob{position:absolute;border-radius:50%;filter:blur(50px);opacity:.5;animation:drift 14s ease-in-out infinite alternate}
.b1{width:260px;height:260px;background:#7c83ff;top:-80px;left:-60px}
.b2{width:220px;height:220px;background:#12b886;right:10%;bottom:-90px;animation-delay:-5s}
.b3{width:180px;height:180px;background:#ff8a5c;right:-40px;top:-30px;animation-delay:-9s}
@keyframes drift{to{transform:translate(60px,40px) scale(1.2)}}
.atom{position:absolute;right:-30px;top:50%;width:260px;height:260px;margin-top:-110px;opacity:.28;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.brand h1 span{display:inline-block;opacity:0;transform:translateY(60%) rotate(8deg);animation:rise .7s cubic-bezier(.2,.9,.3,1.3) forwards;animation-delay:calc(var(--i)*70ms + 150ms)}
@keyframes rise{to{opacity:1;transform:none}}
.brand p{opacity:0;animation:fadein .8s .8s forwards}
@keyframes fadein{to{opacity:.92}}
.card{transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 36px rgba(24,27,44,.16)}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0),var(--acs),transparent 70%)}
.card:hover::after{opacity:.9}
.admin{animation:cardin .6s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0ms)}
@keyframes cardin{from{opacity:0;transform:translateY(28px) scale(.97)}}
.card.fresh{animation:cardin .6s cubic-bezier(.2,.8,.2,1) backwards,fresh 1.8s ease-out}
@keyframes fresh{0%{box-shadow:0 0 0 0 var(--ac)}30%{box-shadow:0 0 0 6px var(--acs),0 0 30px var(--ac)}100%{box-shadow:var(--shadow)}}
.card.out{transition:all .45s cubic-bezier(.4,0,.2,1);opacity:0;transform:translateX(60px) scale(.95);height:0!important;padding-top:0;padding-bottom:0;margin-bottom:0;border-width:0;overflow:hidden}
.sk{height:120px;border:1px solid var(--bd);border-radius:16px;margin-bottom:14px;background:linear-gradient(100deg,var(--card) 30%,var(--acs) 50%,var(--card) 70%);background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.btn,.hbtn,.chip{position:relative;overflow:hidden;transition:transform .15s,box-shadow .2s,background .15s,border-color .15s}
.btn:hover{box-shadow:0 8px 20px rgba(58,63,216,.35);transform:translateY(-1px)}
.btn:active,.hbtn:active,.chip:active{transform:scale(.95)}
.chip.on{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.08)}}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:grid;gap:8px;z-index:60;width:min(92vw,360px)}
.toast{background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:.92rem;animation:tin .45s cubic-bezier(.2,1.2,.3,1)}
.toast.err{background:var(--danger);color:#fff}
.toast.bye{animation:tout .3s forwards}
@keyframes tin{from{opacity:0;transform:translateY(24px) scale(.9)}}
@keyframes tout{to{opacity:0;transform:translateY(12px) scale(.95)}}
dialog[open]{animation:pop .45s cubic-bezier(.2,1.3,.3,1)}
dialog[open]::backdrop{animation:bd .3s}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.9)}}
@keyframes bd{from{opacity:0}}
dialog.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important}}

/* ===== NEW THEME: seafoam day / aurora night ===== */
:root{
  --bg:#e9f5f2;--card:rgba(255,255,255,.78);--tx:#0b2a2c;--mu:#527174;--bd:rgba(11,42,44,.12);
  --ac:#0e8f8a;--acs:#d3f3ee;--onac:#fff;--bio:#16a34a;--bios:#dcfce7;--jee:#ea580c;--jees:#ffedd5;
  --hd1:#04232b;--hd2:#0e8f8a;--danger:#d62839;
  --shadow:0 1px 2px rgba(11,42,44,.06),0 10px 30px rgba(14,143,138,.12);
  --display:"Sora","Manrope",system-ui,sans-serif;--body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#050a12;--card:rgba(18,28,44,.72);--tx:#e8f4f2;--mu:#8fa8ad;--bd:rgba(150,230,220,.14);
  --ac:#5eead4;--acs:rgba(94,234,212,.14);--onac:#04161a;--bio:#4ade80;--bios:rgba(74,222,128,.15);
  --jee:#fb923c;--jees:rgba(251,146,60,.16);--hd1:#04121c;--hd2:#0b4f55;--danger:#ff7b8a;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.35);
}}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(520px circle at var(--cx,50%) var(--cy,15%),color-mix(in srgb,var(--ac) 16%,transparent),transparent 70%)}
header{border-radius:0 0 40px 40px;padding-bottom:44px}
.b1{background:#2dd4bf}.b2{background:#a78bfa}.b3{background:#fbbf24}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:0;animation:tw var(--t) ease-in-out var(--dl) infinite}
@keyframes tw{50%{opacity:.9;transform:scale(2.2)}}
.brand{transform:translateY(calc(var(--sy,0)*.3px));opacity:calc(1 - var(--sy,0)/520)}
.brand h1 span{filter:blur(12px);background:linear-gradient(100deg,#fff 40%,#99f6e4 50%,#fff 60%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:rise2 .9s cubic-bezier(.2,.9,.3,1.3) forwards,sheen 5s linear 2.2s infinite;animation-delay:calc(var(--i)*80ms + 150ms),2.2s}
@keyframes rise2{to{opacity:1;transform:none;filter:none}}
@keyframes sheen{to{background-position:-250% 0}}
.card{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:8px 22px 22px 8px;transition:transform .2s ease-out,box-shadow .35s}
.card:hover{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-4px);box-shadow:0 18px 44px color-mix(in srgb,var(--ac) 22%,transparent)}
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
.card::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;pointer-events:none;opacity:0;transition:opacity .3s;animation:ang 3s linear infinite;
  background:conic-gradient(from var(--ang),transparent 0 55%,var(--ac),var(--bio),transparent);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.card:hover::before{opacity:1}
@keyframes ang{to{--ang:360deg}}
.meta>:nth-child(1){--k:1}.meta>:nth-child(2){--k:2}.meta>:nth-child(3){--k:3}.meta>:nth-child(4){--k:4}
.card.fresh .meta>*{animation:tagpop .55s cubic-bezier(.2,1.5,.4,1) backwards;animation-delay:calc(var(--d,0ms) + var(--k)*70ms + 250ms)}
@keyframes tagpop{from{opacity:0;transform:scale(.4) translateY(8px)}}
.admin{backdrop-filter:blur(14px);border-radius:22px}
.btn{background:linear-gradient(135deg,var(--ac),var(--bio))}
.btn.ghost{background:transparent}.btn.ghost::after{display:none}
.btn::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%)}
.btn:hover::after{transform:translateX(120%);transition:transform .7s}
.btn:hover{box-shadow:0 8px 22px color-mix(in srgb,var(--ac) 45%,transparent)}
.chip{backdrop-filter:blur(8px)}
.chip.on{background:linear-gradient(135deg,var(--ac),var(--bio));border-color:transparent;box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 45%,transparent)}
a.go:hover{background:linear-gradient(135deg,var(--ac),var(--bio))}

/* ===== PDF + JEE/NEET graphics ===== */
input[type=file]{border:2px dashed var(--ac);background:var(--acs);cursor:pointer;transition:transform .2s}
input[type=file]:hover{transform:scale(1.01)}
input[type=file]::file-selector-button{margin-right:12px;border:0;border-radius:8px;padding:6px 12px;background:var(--ac);color:var(--onac);font:inherit;font-weight:600;cursor:pointer}
.btn.busy{pointer-events:none}
.btn.busy::before{content:"";position:absolute;left:0;bottom:0;height:3px;width:40%;background:#fff;animation:ind 1s ease-in-out infinite}
@keyframes ind{from{left:-40%}to{left:100%}}
.pdfrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border:1px dashed var(--ac);border-radius:14px;background:var(--acs)}
.pdfrow a.go{margin:0 0 0 auto;background:var(--ac);color:var(--onac)}
.pdfname{flex:1;min-width:120px;font-weight:600;overflow-wrap:anywhere}
.pdfbadge{background:linear-gradient(135deg,#ef4444,#f97316);color:#fff;font:800 .72rem var(--display);padding:7px 9px;border-radius:8px;animation:pb 2.4s ease-in-out infinite}
@keyframes pb{50%{transform:translateY(-3px) rotate(-6deg);box-shadow:0 6px 14px rgba(239,68,68,.4)}}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;background-image:linear-gradient(var(--bd) 1px,transparent 1px),linear-gradient(90deg,var(--bd) 1px,transparent 1px);background-size:40px 40px;-webkit-mask:linear-gradient(#000,transparent 70%);mask:linear-gradient(#000,transparent 70%)}
.glyph{position:absolute;color:#fff;opacity:.17;font:600 var(--s) var(--display);pointer-events:none;white-space:nowrap;animation:fl var(--t) ease-in-out var(--dl) infinite alternate}
@keyframes fl{from{transform:translate(0,0) rotate(-6deg)}to{transform:translate(24px,-34px) rotate(8deg)}}
.dna{position:absolute;right:180px;top:18px;display:grid;gap:7px;opacity:.5}
.dna .r{display:block;width:50px;height:8px;position:relative;background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,.3)) center/calc(100% - 10px) 1px no-repeat}
.dna .r::before,.dna .r::after{content:"";position:absolute;top:0;width:8px;height:8px;border-radius:50%;animation:hx 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*-.17s)}
.dna .r::before{left:0;background:#5eead4}
.dna .r::after{left:42px;background:#fb923c;animation-name:hy}
@keyframes hx{50%{transform:translateX(42px) scale(.55);opacity:.5}}
@keyframes hy{50%{transform:translateX(-42px) scale(.55);opacity:.5}}
.benz{position:absolute;left:-18px;bottom:36px;width:120px;opacity:.22;animation:spin 60s linear infinite reverse}
.waves{position:absolute;left:0;right:0;bottom:0;height:42px;overflow:hidden;opacity:.5}
.waves svg{position:absolute;left:0;bottom:0;width:200%;height:100%;animation:wv 8s linear infinite}
.waves svg:nth-child(2){bottom:6px;opacity:.6;animation-duration:13s;animation-direction:reverse}
@keyframes wv{to{transform:translateX(-50%)}}
@media (max-width:600px){.dna{right:14px;top:64px}}

/* ===== THEME 3: forest green (night and day) + PDF reader ===== */
:root{
  --bg:#f0f7f1;--card:rgba(255,255,255,.84);--tx:#14281b;--mu:#5d7563;--bd:rgba(20,40,27,.13);
  --ac:#16803c;--ac2:#65a30d;--acs:#e0f2e5;--onac:#fff;--hd1:#092b18;--hd2:#16803c;--danger:#c62828;
  --shadow:0 1px 2px rgba(20,40,27,.06),0 12px 32px rgba(22,128,60,.14);
  --display:"Syne","Outfit",system-ui,sans-serif;--body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#08140c;--card:rgba(20,36,24,.82);--tx:#e8f4e9;--mu:#9bb2a0;--bd:rgba(180,220,187,.16);
  --ac:#4ade80;--ac2:#a3e635;--acs:rgba(74,222,128,.15);--onac:#082010;--hd1:#06190d;--hd2:#14532d;--danger:#ff7b7b;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.4);
}}
header{border-radius:0;clip-path:polygon(0 0,100% 0,100% calc(100% - 30px),0 100%);padding-bottom:64px}
.b1{background:#4ade80}.b2{background:#a3e635}.b3{background:#34d399}
.brand h1{letter-spacing:.04em}
.brand h1 span{background-image:linear-gradient(100deg,#fff 40%,#bbf7d0 50%,#fff 60%);animation-delay:calc(var(--i)*80ms + 1.4s),3.6s}
.brand p{animation:fadein .8s 1.9s forwards}
.card{border-radius:26px 8px 26px 8px}
.card::before{background:conic-gradient(from var(--ang),transparent 0 50%,var(--ac),var(--ac2),transparent)}
.btn,.chip.on{background:linear-gradient(135deg,var(--ac),var(--ac2))}
.btn.ghost{background:transparent}
a.go:hover{background:linear-gradient(135deg,var(--ac),var(--ac2))}
.dna .r::before{background:#86efac}.dna .r::after{background:#bef264}
.waves svg:first-child path{stroke:#86efac}.waves svg:last-child path{stroke:#bef264}
@keyframes cardin{from{opacity:0;transform:translateY(40px) rotateX(-14deg) scale(.95);filter:blur(6px)}}
.pdfbadge{background:linear-gradient(135deg,var(--ac),var(--ac2))}
/* intro curtain */
#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;text-align:center;color:#fff;background:radial-gradient(circle at 50% 40%,var(--hd2),var(--hd1));animation:introout .9s cubic-bezier(.76,0,.24,1) 1.2s forwards}
#intro .orb{position:relative;width:120px;height:120px;margin:0 auto}
#intro .orb i{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:#86efac;animation:spin 1.1s linear infinite}
#intro .orb i:nth-child(2){inset:14px;border-top-color:#bef264;animation-duration:1.6s;animation-direction:reverse}
#intro .orb i:nth-child(3){inset:30px;border-top-color:#fff;animation-duration:.8s}
#intro b{display:block;margin-top:20px;font:800 1.5rem var(--display);letter-spacing:.3em;animation:fi .8s backwards}
@keyframes fi{from{opacity:0;transform:translateY(10px)}}

/* in-page PDF reader */
#pdfDlg{width:min(1000px,96vw);height:94dvh;max-width:none;max-height:none;padding:0;border:0;border-radius:26px;overflow:hidden;background:var(--bg);color:var(--tx)}
#pdfDlg[open]{animation:pvin .6s cubic-bezier(.16,1,.3,1)}
#pdfDlg::backdrop{background:rgba(8,4,24,.72);backdrop-filter:blur(8px)}
@keyframes pvin{from{opacity:0;transform:translateY(8vh) scale(.92);filter:blur(10px)}}
.pv{display:flex;flex-direction:column;height:100%}
.pvbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;background:var(--card);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);animation:sd .5s .15s backwards}
@keyframes sd{from{opacity:0;transform:translateY(-100%)}}
.pvt{flex:1;min-width:120px;font:700 1rem var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pvbar .hbtn{color:var(--tx);background:var(--acs);border-color:var(--bd);text-decoration:none}
.pvbar span#pvzoom{min-width:44px;text-align:center;font-size:.85rem;color:var(--mu)}
.pvprog{height:3px;background:var(--bd)}
.pvprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .3s}
.pvbody{flex:1;overflow:auto;padding:18px 12px 48px;perspective:1200px}
.pg{display:block;margin:0 auto 18px;max-width:none;height:auto;border-radius:10px;background:#fff;box-shadow:var(--shadow);opacity:0;transform:translateY(30px) rotateX(-6deg) scale(.97);transition:opacity .6s,transform .7s cubic-bezier(.2,.8,.2,1)}
@media (hover:none),(pointer:coarse){
  .card{backdrop-filter:none;-webkit-backdrop-filter:none;transition:box-shadow .2s ease}
  .card:hover{transform:none;box-shadow:var(--shadow)}
  .card:hover::after,.card:hover::before{opacity:0}
  .card::before{animation:none}
  .card.fresh{animation:cardin .4s ease-out backwards;animation-delay:var(--d,0ms)}
  .card.fresh{animation:cardin .4s ease-out backwards,fresh 1.8s ease-out}
  .card.fresh .meta>*{animation:tagpop .35s ease-out backwards;animation-delay:calc(var(--d,0ms) + var(--k)*45ms + 100ms)}
  @keyframes cardin{from{opacity:0;transform:translateY(12px)}}
  @keyframes tagpop{from{opacity:0;transform:translateY(4px)}}
}
.pg.on{opacity:1;transform:none}

  return (f.kind==='all'||p.kind===f.kind)&&(f.cls==='all'||p.cls==='both'||p.cls===f.cls)&&(f.sec==='all'||p.sec==='both'||p.sec===f.sec);

        if(p.kind==='pdf'&&p.url){const k=decodeURIComponent((p.url.split('/pdfs/')[1]||'').split('?')[0]);if(k)sb.storage.from('pdfs').remove([k])}

      };

    }
    const meta=el('div','meta');
    meta.appendChild(el('span','tag kind'+(p.kind!=='announcement'?' link':''),({link:'Link',pdf:'PDF'})[p.kind]||'Announcement'));
    meta.appendChild(el('span','tag',p.cls==='both'?'Class 11th & 12th':'Class '+p.cls));
    meta.appendChild(el('span','tag '+(p.sec==='Bio core'?'bio':p.sec==='JEE core'?'jee':''),p.sec==='both'?'Bio core & JEE core':p.sec));

    c.appendChild(meta);

    if(p.body)c.appendChild(el('p',null,p.body));
    if(p.kind==='link'||p.kind==='pdf'){const u=safeUrl(p.url);if(u){
      const a=el('a','go',p.kind==='pdf'?'Read PDF':'Open link');a.href=u;a.target='_blank';a.rel='noopener noreferrer';
      if(p.kind==='pdf'){a.onclick=ev=>{ev.preventDefault();openPdf(u,p.file_name||p.title)};const row=el('div','pdfrow');row.appendChild(el('span','pdfbadge','PDF'));row.appendChild(el('span','pdfname',p.file_name||'Document'));row.appendChild(a);c.appendChild(row)}else c.appendChild(a)}}

    c.addEventListener('pointerleave',()=>{c.style.removeProperty('--rx');c.style.removeProperty('--ry')});
  });
}

function buildForm(){
  const w=el('div','admin');

  w.appendChild(el('p','hint','Students will see this right away.'));
  const sel=o=>{const s=el('select');o.forEach(a=>{const op=el('option',null,a[1]);op.value=a[0];s.appendChild(op)});return s};

  const r=el('div','row');

  const msg=el('div','msg');
  const btn=el('button','btn','Publish');
  btn.onclick=async()=>{
    msg.textContent='';
    const t=title.value.trim();if(!t){msg.textContent='Enter a title.';return}
    let u=null;if(type.value==='link'){u=safeUrl(url.value.trim());if(!u){msg.textContent='Enter a link that starts with http:// or https://';return}}
    let fname=null;const fl=file.files[0];
    if(type.value==='pdf'){
      if(!fl){msg.textContent='Choose a PDF file.';return}
      if(fl.type!=='application/pdf'&&!/\.pdf$/i.test(fl.name)){msg.textContent='Only PDF files are allowed.';return}
      if(fl.size>10*1024*1024){msg.textContent='PDF must be under 10 MB.';return}
    }
    btn.disabled=true;btn.classList.add('busy');
    if(type.value==='pdf'){
      const path=Date.now()+'-'+fl.name.replace(/[^\w.\-]+/g,'_');
      const up=await sb.storage.from('pdfs').upload(path,fl,{contentType:'application/pdf'});
      if(up.error){btn.disabled=false;btn.classList.remove('busy');msg.textContent='Upload failed: '+up.error.message;toast('Upload failed',1);return}
      u=sb.storage.from('pdfs').getPublicUrl(path).data.publicUrl;fname=fl.name;
    }
    const {data,error}=await sb.from('posts').insert({kind:type.value,title:t,body:body.value.trim()||null,url:u,file_name:fname,cls:cls.value,sec:sec.value}).select().single();
    btn.disabled=false;btn.classList.remove('busy');
    if(error){msg.textContent='Could not publish: '+error.message;toast('Could not publish',1);return}
    title.value='';body.value='';url.value='';file.value='';
    freshId=data.id;posts.unshift(data);renderFeed();toast('Post published');burst(btn);
  };
  w.appendChild(btn);w.appendChild(msg);return w;
}

async function load(){
  const {data,error}=await sb.from('posts').select('*').order('created_at',{ascending:false});
  if(error){const feed=document.getElementById('feed');feed.textContent='';feed.appendChild(el('div','empty','Could not load posts. Check the Supabase setup.'));return}
  posts=data||[];renderFeed();
}

function burst(b){

}

/* ---------- In-page PDF reader (pdf.js) ---------- */
const pvd=document.getElementById('pdfDlg'),pvb=document.getElementById('pvb');
let pvZoom=1,pvTok=0,pvIO=null;
const pvW=()=>Math.max(200,Math.min(pvb.clientWidth-24,900));
const pvProg=x=>{document.getElementById('pvbar').style.width=x*100+'%'};
function pvApply(){document.getElementById('pvzoom').textContent=Math.round(pvZoom*100)+'%';pvb.querySelectorAll('.pg').forEach(c=>c.style.width=pvW()*pvZoom+'px')}
async function pvRender(pdf,c,tok){
  const page=await pdf.getPage(+c.dataset.n);if(tok!==pvTok)return;
  const b=page.getViewport({scale:1}),sc=Math.min(2400,pvW()*Math.min(devicePixelRatio||1,2)*1.5)/b.width,vp=page.getViewport({scale:sc});
  c.width=vp.width;c.height=vp.height;
  await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;if(tok===pvTok)c.classList.add('on');
}
async function openPdf(url,name){
  const tok=++pvTok,lib=window.pdfjsLib;
  if(!lib){window.open(url,'_blank','noopener');return}
  lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  document.getElementById('pvt').textContent=name||'Document';document.getElementById('pvdown').href=url;
  pvb.textContent='';pvZoom=1;pvProg(0);if(!pvd.open)pvd.showModal();
  try{
    const task=lib.getDocument(url);task.onProgress=e=>{if(e.total)pvProg(e.loaded/e.total*.8)};
    const pdf=await task.promise;if(tok!==pvTok)return;
    const f=await pdf.getPage(1),v=f.getViewport({scale:1});
    pvIO&&pvIO.disconnect();
    pvIO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){pvIO.unobserve(e.target);pvRender(pdf,e.target,tok)}}),{root:pvb,rootMargin:'700px 0px'});
    for(let i=1;i<=pdf.numPages;i++){const c=document.createElement('canvas');c.className='pg';c.dataset.n=i;c.style.aspectRatio=v.width+'/'+v.height;pvb.appendChild(c);pvIO.observe(c)}
    pvApply();pvProg(1);setTimeout(()=>pvProg(0),600);
  }catch(err){if(tok===pvTok)pvb.appendChild(el('div','empty','Could not show this PDF here. Use Download instead.'))}
}
document.getElementById('pvminus').onclick=()=>{pvZoom=Math.max(.5,pvZoom-.25);pvApply()};
document.getElementById('pvplus').onclick=()=>{pvZoom=Math.min(2.5,pvZoom+.25);pvApply()};
document.getElementById('pvclose').onclick=()=>pvd.close();
pvd.addEventListener('click',e=>{if(e.target===pvd)pvd.close()});
pvd.addEventListener('close',()=>{pvTok++;pvIO&&pvIO.disconnect();pvb.textContent=''});
addEventListener('resize',()=>{if(pvd.open)pvApply()});
